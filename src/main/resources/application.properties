spring.application.name=familia-connect

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DB_TYPE_DDL}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

server.error.include-message=always
server.error.include-binding-errors=always

# segredo do token via variavel de ambiente (minimo 32 caracteres)
jwt.issuer=exemplo-jwt-api
jwt.audience=exemplo-jwt-client

jwt.secret=YjE1OWE3Yzk5ZDNmNmU5ZDQyMGU4ZGRmZGI5MjEzYzljOTlkM2Y2ZTlkNDIwZThkZGZkYjkyMTNjOWM5OWQzZjZlOWQ0MjBlOGRkZmRiOTIxM2M5Yzk5ZDNmNmU5ZDQyMGU4ZGRmZGI5MjEzYzljOTk=
jwt.validity=3600

# Ordena os endpoints dentro de cada grupo (ex: GET, POST, PUT, DELETE em ordem alfabética)
springdoc.swagger-ui.operationsSorter=alpha

# Ordena os grupos (Tags) alfabeticamente (ex: Acessos, Estados, Funcionários, Permissões)
springdoc.swagger-ui.tagsSorter=alpha

url-ocr-service=${URL_OCR_SERVICE}

#Paginação
spring.data.web.pageable.max-page-size=50

# Limites de upload para evitar erro ao enviar arquivos maiores.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Estratégia de storage (local | s3).
# Pode ser sobrescrita por variável de ambiente APP_STORAGE_TYPE.
app.storage.type=${APP_STORAGE_TYPE:local}

# Configurações do storage local.
# Pode ser sobrescrita por APP_STORAGE_LOCAL_PATH.
app.storage.local.path=${APP_STORAGE_LOCAL_PATH:uploads}

# Configurações do storage S3.
# Pode ser sobrescrita por APP_STORAGE_S3_BUCKET e APP_STORAGE_S3_REGION.
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:familia-connect-gold-bucket}
app.storage.s3.region=${APP_STORAGE_S3_REGION:us-east-1}